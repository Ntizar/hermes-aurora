<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>three-intro</title>
<style>
  html, body { height: 100%; background: #05060a; margin: 0; overflow: hidden; }
  canvas { display: block; position: absolute; inset: 0; z-index: 1; }
  .claim { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center;
           font-family: "Inter var", -apple-system, "Helvetica Neue", Arial, sans-serif; pointer-events: none; }
  .claim h1 { font-size: 150px; font-weight: 800; letter-spacing: -0.02em; color: #fff;
              margin: 0; white-space: nowrap; will-change: opacity, filter; }
  /* Cada letra, una marca Aurora (los 500 oficiales de las rampas) */
  .claim h1 span { display: inline-block; }
  .c1 { color: #3a7aff; } .c2 { color: #6261ff; } .c3 { color: #417eff; }
  .c4 { color: #2f9e74; } .c5 { color: #ff8c4e; } .c6 { color: #a78bfa; }
  .claim .sub { position: absolute; top: 66%; width: 100%; text-align: center;
                font-size: 28px; letter-spacing: .5em; text-transform: uppercase; color: #9aa4b8; }
</style>
</head>
<body>
<canvas id="lienzo" width="1600" height="900"></canvas>
<div class="claim">
  <h1 data-claim="1.6,1.6"><span class="c1">A</span><span class="c2">U</span><span class="c3">R</span><span class="c4">O</span><span class="c5">R</span><span class="c6">A</span></h1>
  <div class="sub" data-d="3.2">design system · for agents</div>
</div>
<script>
// Campo de partículas de las SEIS MARCAS de Aurora en canvas 2D con profundidad
// pseudo-3D. Determinismo total (arregla el parpadeo del v5): la posición es una
// función CERRADA del tiempo — nada de acumulación fotograma a fotograma ni WebGL
// con swiftshader (que además costaba 1.5 s por fotograma en esta VM).
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const cv = document.getElementById('lienzo');
const g = cv.getContext('2d');
const COLES = ['#3a7aff', '#6261ff', '#417eff', '#2f9e74', '#ff8c4e', '#a78bfa'];
const N = 3200;
const P = [];
const rnd = mulberry32(20261106);
for (let i = 0; i < N; i++) {
  P.push({
    ang: rnd() * Math.PI * 2,
    r0: 8 + Math.pow(rnd(), 0.55) * 24,     // radio inicial, disperso (en unidades de escena)
    z: rnd(),                                // profundidad 0..1 (tamaño y brillo)
    s: rnd() * Math.PI * 2,                  // fase propia
    col: COLES[Math.floor(rnd() * COLES.length)],
    br: 0.55 + rnd() * 0.45
  });
}
const CX = 800, CY = 415, ESC = 26;
function pintar(t) {
  g.fillStyle = '#05060a'; g.fillRect(0, 0, 1600, 900);
  const zoom = 1 + Math.min(t * 0.045, 0.15);
  // convergencia al anillo: forma cerrada, suave cúbico desde t=1.0 hasta 3.4
  const k = Math.max(Math.min((t - 1.0) / 2.4, 1), 0);
  const conv = 1 - Math.pow(1 - k, 3);
  for (const p of P) {
    const banda = 9.6 + (p.s % 1) * 0.7;                      // radio objetivo de la banda del anillo
    const r = (p.r0 + (banda - p.r0) * conv) * ESC * zoom;
    const giro = p.ang + t * (0.10 + p.z * 0.10);
    const x = CX + Math.cos(giro) * r;
    const y = CY + Math.sin(giro) * r * 0.36 + Math.sin(t * 0.8 + p.s) * 8 * (1 - conv);
    const tam = (0.6 + p.z * 2.8) * zoom;
    const parpadeo = 0.6 + 0.4 * Math.sin(t * 1.6 + p.s * 4);  // centelleo suave determinista
    g.globalAlpha = Math.max(0.06, Math.min(p.br * parpadeo * (0.35 + 0.65 * p.z), 0.92));
    g.fillStyle = p.col;
    g.beginPath(); g.arc(x, y, tam, 0, 6.2832); g.fill();
    if (p.z > 0.9) {                                           // halo bokeh en las cercanas
      g.globalAlpha *= 0.18;
      g.beginPath(); g.arc(x, y, tam * 3.4, 0, 6.2832); g.fill();
    }
  }
  // anillo orbital fino (azul marca aurora) con respiración
  g.globalAlpha = 0.38 + 0.12 * Math.sin(t * 0.9);
  g.strokeStyle = '#417eff'; g.lineWidth = 2.5;
  g.beginPath();
  g.ellipse(CX, CY, 9.9 * ESC * zoom, 9.9 * ESC * 0.36 * zoom, 0, 0, 6.2832);
  g.stroke();
  g.globalAlpha = 1;
}
window.__pintar = pintar;   // el rasterizador puede fijar t desde fuera
if (window.__t !== undefined) {
  pintar(window.__t);       // modo rasterizador (t inyectado por línea de comando JS)
} else {
  const t0 = performance.now();
  (function loop() {
    pintar((performance.now() - t0) / 1000);
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
